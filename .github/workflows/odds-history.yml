name: Odds history collector
on:
  schedule:
    - cron: '40 14,16,18,20,22,23,0,1 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: odds-history }
      - name: Collect
        env: { ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}' }
        run: python3 collector/collect_odds.py . | tee summary.txt
      - name: Commit and push
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/
          git commit -m "Snapshot $(cat summary.txt)" || exit 0
          git push origin HEAD:odds-history
